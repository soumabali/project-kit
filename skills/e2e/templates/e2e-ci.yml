# Copy to .github/workflows/e2e.yml and adjust the stack start command, ports, and secrets.
# Actions are pinned to full commit SHAs (version in the comment); let Dependabot or Renovate keep them current.
# Fork pull requests get no secrets: sign-in tests and signed-in screens then skip instead of failing.
name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Start the stack with production builds
        run: docker compose up -d --build --wait

      - name: Install e2e dependencies and browsers
        working-directory: 07-application/e2e
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Lint and type-check the tests
        working-directory: 07-application/e2e
        run: npm run lint && npm run typecheck

      # Secrets reach only the steps that sign in, never dependency installs.
      - name: End-to-end tests
        working-directory: 07-application/e2e
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npx playwright test --grep-invert @visual

      - name: Visual tests in the official Playwright image (matches the committed baselines)
        working-directory: 07-application/e2e
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npm run test:visual

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: 07-application/e2e/playwright-report/
          retention-days: 14

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
